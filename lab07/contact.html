<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Tier List Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="tierlist.html">Tier List</a> |
        <a href="contact.html">Contact Form</a>
    </nav>

    <h1>Soccer Tier List Feedback Form</h1>
    <p>Fill out this form to share your opinion about my tier list.</p>

    <form action="#" method="post">
        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="bestplayer">Who is the best soccer player?</label><br>
            <input type="text" id="bestplayer" name="bestplayer">
        </p>

        <p>Which tier do you agree with most?</p>
        <input type="radio" id="s" name="tier" value="S">
        <label for="s">S Tier</label><br>

        <input type="radio" id="a" name="tier" value="A">
        <label for="a">A Tier</label><br>

        <input type="radio" id="b" name="tier" value="B">
        <label for="b">B Tier</label><br>

        <p>Which players do you like?</p>
        <input type="checkbox" id="messi" name="player1" value="Messi">
        <label for="messi">Messi</label><br>

        <input type="checkbox" id="ronaldo" name="player2" value="Ronaldo">
        <label for="ronaldo">Ronaldo</label><br>

        <input type="checkbox" id="mbappe" name="player3" value="Mbappe">
        <label for="mbappe">Mbappe</label><br>

        <p>
            <label for="team">Favorite team:</label><br>
            <select id="team" name="team">
                <option value="">Choose one</option>
                <option value="real-madrid">Real Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="man-city">Manchester City</option>
                <option value="psg">PSG</option>
            </select>
        </p>

        <p>
            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="30"></textarea>
        </p>

        <p>
            <input type="submit" value="Submit">
        </p>
    </form>

</body>
</html>
